<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:424px;overflow:hidden}
body{background:#0E0F12;color:#EDEDEF;font-family:'Space Grotesk',system-ui,sans-serif;position:relative}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.frame{position:absolute;inset:0;padding:40px 56px 44px;display:flex;flex-direction:column}
.rule{height:2px;background:#EDEDEF}
.spec{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(237,237,239,.6)}
.spec b{font-weight:400;color:#EDEDEF}
.grid{display:grid;grid-template-columns:440px 1fr;gap:56px;flex:1;align-items:center;margin-top:8px}
.brand{display:flex;flex-direction:column;gap:22px}
.lockup{display:flex;align-items:center;gap:26px}
.word{font-weight:700;font-size:88px;line-height:1;letter-spacing:-.025em}
.lead{font-size:19px;line-height:1.4;color:rgba(237,237,239,.82);max-width:420px}
.by{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(237,237,239,.6)}
.card{background:#17181C;border:1px solid #2A2B31;border-top:2px solid #EDEDEF;border-radius:14px;padding:14px 20px 18px;justify-self:end;width:100%}
.hdr{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.02em;margin-bottom:12px}
.hdr span:last-child{color:rgba(237,237,239,.6);letter-spacing:.08em}
pre{background:#0A0B0E;padding:16px 18px;font-size:12.5px;line-height:1.75;color:rgba(237,237,239,.82);white-space:pre;overflow:hidden}
.fn{color:#EDEDEF}.addr{color:#6B8AFF}.dim{color:rgba(237,237,239,.6)}.bad{color:#FF6B6B}.ok{color:#00FFFF}
.cap{margin-top:10px;font-size:11px;line-height:1.5;color:rgba(237,237,239,.6)}

.frame{padding:40px 56px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.center .word{font-size:120px}
.center .lockup{gap:36px}

.tags{display:flex;gap:10px}
.tag{font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1;padding:7px 10px 6px;color:#6B8AFF;border:1px solid color-mix(in srgb,#6B8AFF 55%,transparent);border-radius:4px;font-weight:400}
.spec{padding-top:14px;align-items:center}
</style>
