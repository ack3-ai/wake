name: Build documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy instead of dev (e.g. 5.0.0rc3)"
        default: ""
      ref:
        description: "Tag or commit to build the docs from (default: the current branch)"
        default: ""
      latest:
        description: "Also move the latest alias to this version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          ref: ${{ inputs.ref }}
      - name: Set up Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fetch documentation branch
        run: git fetch origin documentation:documentation --depth=1
      - name: Build documentation
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          if [ -n "${{ inputs.version }}" ]; then
            mike deploy -b documentation --update-aliases "${{ inputs.version }}" ${{ inputs.latest && 'latest' || '' }}
          else
            mike deploy -b documentation dev
          fi
      - name: Push documentation
        run: git push origin documentation
