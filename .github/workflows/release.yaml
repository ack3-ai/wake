name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_linux_arm64_wheels:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        abi: [manylinux, musllinux]

    steps:
      - name: Checkout latest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Install cibuildwheel
        run: |
          python3 -m pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel . --output-dir wheelhouse
        env:
          CIBW_BUILD: "*-${{ matrix.abi }}_*"
          CIBW_SKIP: pp*
          CIBW_ARCHS_LINUX: aarch64
          CIBW_ENABLE: cpython-freethreading
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y openssl-devel libatomic || apt install -y pkg-config libssl-dev libatomic1 || apk add --no-cache openssl-dev
            curl -sSf https://sh.rustup.rs | sh -s -- --default-toolchain=stable --profile=minimal -y
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ runner.os }}-${{ matrix.abi }}-arm64
          path: ./wheelhouse/*.whl

  build_linux_wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [manylinux, musllinux]
        arch: [x86_64, i686]
        exclude:
          - abi: musllinux
            arch: i686

    steps:
      - name: Checkout latest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Install cibuildwheel
        run: |
          python3 -m pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel . --output-dir wheelhouse
        env:
          CIBW_BUILD: "*-${{ matrix.abi }}_*"
          CIBW_SKIP: pp*
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ENABLE: cpython-freethreading
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y openssl-devel libatomic || apt install -y pkg-config libssl-dev libatomic1 || apk add --no-cache openssl-dev
            curl -sSf https://sh.rustup.rs | sh -s -- --default-toolchain=stable --profile=minimal -y
            echo $LD_LIBRARY_PATH
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ runner.os }}-${{ matrix.abi }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_macos_wheels:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout latest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Add x86-64 Rust target
        run: |
          rustup target add x86_64-apple-darwin

      - name: Update Rust
        run: |
          rustup update stable && rustup default stable

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Install cibuildwheel
        run: |
          python3 -m pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel . --output-dir wheelhouse
        env:
          CIBW_SKIP: pp*
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ENABLE: cpython-freethreading
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
            if [ "$(uname -m)" = "x86_64" ]; then
                export MACOSX_DEPLOYMENT_TARGET=10.12
            else
                export MACOSX_DEPLOYMENT_TARGET=14.0
            fi
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ runner.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_windows_arm64_wheels:
    runs-on: windows-11-arm
    steps:
      - name: Checkout latest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Add ARM64 Rust target
        run: |
          rustup target add aarch64-pc-windows-msvc
          rustup default stable-aarch64-pc-windows-msvc

      - name: Install cibuildwheel
        run: |
          python3 -m pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel . --output-dir wheelhouse
        env:
          CIBW_SKIP: pp*
          CIBW_ARCHS_WINDOWS: ARM64
          CIBW_ENABLE: cpython-freethreading
          CIBW_BUILD_VERBOSITY: 3

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ runner.os }}-arm64
          path: ./wheelhouse/*.whl

  build_windows_wheels:
    runs-on: windows-latest
    steps:
      - name: Checkout latest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Install cibuildwheel
        run: |
          python3 -m pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel . --output-dir wheelhouse
        env:
          CIBW_SKIP: pp*
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENABLE: cpython-freethreading

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ runner.os }}-AMD64
          path: ./wheelhouse/*.whl

  pypi:
    runs-on: ubuntu-latest
    needs: [build_linux_arm64_wheels, build_linux_wheels, build_macos_wheels, build_windows_arm64_wheels, build_windows_wheels]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: 3.12

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "latest"

    - name: Download all wheel artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: wheels-*
        path: wheelhouse
        merge-multiple: true

    - name: List wheelhouse
      run: ls -la wheelhouse

    - name: Build and upload to PyPI
      run: uv build --sdist && uv publish --token ${{ secrets.PYPI_DEPLOY_TOKEN }} dist/*.tar.gz wheelhouse/*.whl

